name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

      - name: Config schema is current
        run: npm run schema -- --check

      - name: CLI smoke test
        run: |
          node dist/cli.js --version
          node dist/cli.js init --dir "$RUNNER_TEMP/skillhook" --json
          node dist/cli.js skills validate --dir "$RUNNER_TEMP/skillhook" --json

      - name: Audit production dependencies
        run: npm audit --omit=dev
