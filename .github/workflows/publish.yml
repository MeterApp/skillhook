name: Publish package

# Publishes to npm when a v* tag is pushed. Requires npm trusted publishing to be configured
# for the `skillhook` package (npmjs.com → package → Settings → Trusted publisher: this repo/workflow).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: publish-package
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          # npm trusted publishing requires Node 22.14+ and npm 11.5.1+.
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Check
        run: npm run typecheck && npm test && npm run build

      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          expected="v$(node -p "require('./package.json').version")"
          [ "$GITHUB_REF_NAME" = "$expected" ] || { echo "tag $GITHUB_REF_NAME != $expected"; exit 1; }

      - name: Publish
        run: npm publish --provenance --access public
