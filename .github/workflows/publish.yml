name: Publish

# Publishes one tagged version to npm (with provenance), creates the matching GitHub release and then installs
# the package from the registry to prove it works. Runs when:
#   - the Release workflow has tagged a version bump that landed on main (it dispatches this workflow),
#   - someone pushes a v* tag by hand,
#   - someone publishes a GitHub release by hand,
#   - "Run workflow" is used with a tag.
# Publishing is idempotent: a version that is already on npm is skipped, not republished.
#
# Authentication: npm trusted publishing (OIDC) for this repository, workflow file `publish.yml`, environment `npm`,
# configured once at npmjs.com → skillhook → Settings → Trusted publisher. An NPM_TOKEN repository secret, when
# present, is used instead. See CONTRIBUTING.md → Releasing.

on:
  push:
    tags: ["v*"]
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish, e.g. v0.2.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.tag || github.event.release.tag_name || github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: npm
      url: https://www.npmjs.com/package/skillhook
    permissions:
      contents: write # create the GitHub release
      id-token: write # npm trusted publishing and provenance
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Resolve the tag
        id: tag
        env:
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          tag="${INPUT_TAG:-${RELEASE_TAG:-}}"
          if [ -z "$tag" ] && [ "$REF_TYPE" = "tag" ]; then tag="$REF_NAME"; fi
          case "$tag" in
            v[0-9]*) ;;
            *) echo "::error::'$tag' is not a release tag (expected vX.Y.Z)"; exit 1 ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ steps.tag.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # npm trusted publishing needs npm 11.5.1+ (Node 22.14+); no dependency cache in release builds.
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Tag matches package.json and the release metadata is consistent
        id: meta
        env:
          TAG: ${{ steps.tag.outputs.tag }}
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match package.json version $version"
            exit 1
          fi
          npm run release -- --check
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Already on npm?
        id: exists
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if npm view "skillhook@$VERSION" version >/dev/null 2>&1; then
            echo "skillhook@$VERSION is already on npm; nothing to publish"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        # `prepublishOnly` runs the full check (typecheck, tests, build, schema, release metadata) first.
        if: steps.exists.outputs.published != 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -n "$NPM_TOKEN" ]; then
            echo "Authenticating with the NPM_TOKEN secret"
            export NODE_AUTH_TOKEN="$NPM_TOKEN"
          else
            echo "Authenticating with npm trusted publishing (OIDC)"
          fi
          npm publish --provenance --access public

      - name: First release?
        if: failure() && steps.exists.outputs.published != 'true'
        run: |
          echo "::error::npm publish failed. If this is the first release of the package: publish it once by hand (npm login && npm publish --access public from the v$VERSION tag), then register this repository as a trusted publisher at npmjs.com → skillhook → Settings (workflow publish.yml, environment npm) and re-run this workflow. Details: CONTRIBUTING.md → Releasing."
        env:
          VERSION: ${{ steps.meta.outputs.version }}

      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "release $TAG already exists"
            exit 0
          fi
          notes="$RUNNER_TEMP/notes.md"
          npm run release --silent -- --notes "$VERSION" > "$notes"
          printf '\n---\n\n`npm install -g skillhook@%s` · [npm](https://www.npmjs.com/package/skillhook/v/%s) · [changelog](https://github.com/%s/blob/%s/CHANGELOG.md)\n' "$VERSION" "$VERSION" "$GITHUB_REPOSITORY" "$TAG" >> "$notes"
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "skillhook $VERSION" --notes-file "$notes"

  verify:
    name: Verify the published package
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.publish.outputs.version }}
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Wait for the registry
        run: |
          for attempt in $(seq 1 20); do
            if npm view "skillhook@$VERSION" version >/dev/null 2>&1; then
              echo "skillhook@$VERSION is on npm"
              exit 0
            fi
            echo "attempt $attempt: not visible yet"
            sleep 15
          done
          echo "::error::skillhook@$VERSION did not appear on npm within 5 minutes"
          exit 1

      - name: Install from npm and use it
        run: |
          npm install -g "skillhook@$VERSION"
          test "$(skillhook --version)" = "$VERSION"
          home="$RUNNER_TEMP/home"
          skillhook init --dir "$home" --json
          skillhook skills validate --dir "$home" --json
          skillhook run hello --dir "$home" --payload '{"name":"npm"}' --dry-run --json > /dev/null
          skillhook update --dir "$home" --json
